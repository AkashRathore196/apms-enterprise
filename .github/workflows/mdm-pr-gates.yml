name: MDM PR Acceptance Gates

on:
  pull_request_target:
    branches:
      - main
    paths:
      - 'domains/mdm/**'
      - '.github/workflows/mdm-pr-gates.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  outbox-publisher:
    name: outbox-publisher
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: domains/mdm
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Validate Maven model
        run: mvn -B -DskipTests validate
      - name: Run PostgreSQL-backed publisher integration test
        run: mvn -B -Dtest=OutboxPublisherPostgresIntegrationTest test

  processed-event-idempotency:
    name: processed-event-idempotency
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: domains/mdm
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Validate Maven model
        run: mvn -B -DskipTests validate
      - name: Run PostgreSQL-backed durable idempotency acceptance test
        run: mvn -B -Dtest=ProcessedEventIdempotencyPostgresIntegrationTest test

  eventing-end-to-end:
    name: eventing-end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: domains/mdm
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Validate Maven model
        run: mvn -B -DskipTests validate
      - name: Run Outbox to Kafka to consumer acceptance test
        run: mvn -B -Dtest=OutboxToKafkaConsumerEndToEndIntegrationTest test

  regression-unit:
    name: regression-unit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: domains/mdm
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run unit and application tests
        run: mvn -B -Dtest=MdmApplicationTest,PartyLifecycleAcceptanceTest,ProcessedEventIdempotencyTest test

  regression-postgres:
    name: regression-postgres
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: domains/mdm
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run PostgreSQL integration tests
        run: mvn -B -Dtest=PartyServiceIntegrationTest,MdmIntegrationTest test
