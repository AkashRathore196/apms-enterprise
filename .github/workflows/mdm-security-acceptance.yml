name: MDM Security Acceptance

on:
  pull_request:
    paths:
      - 'infrastructure/security/**'
      - 'domains/mdm/**'
      - '.github/workflows/mdm-security-acceptance.yml'
  workflow_dispatch:

jobs:
  security-acceptance:
    name: Keycloak/Kong security acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Validate security acceptance contract
        shell: bash
        run: |
          set -euo pipefail
          test -f infrastructure/security/README.md
          test -f infrastructure/security/keycloak/kong-jwt-verification-contract-v1.0.md
          test -f infrastructure/security/mdm-keycloak-kong-acceptance-plan-v1.0.md
          test -f docs/ci/mdm-keycloak-kong-acceptance-runbook-v1.0.md
          grep -q 'missing token -> 401' infrastructure/security/keycloak/kong-jwt-verification-contract-v1.0.md
          grep -q 'invalid signature -> 401' infrastructure/security/keycloak/kong-jwt-verification-contract-v1.0.md
          grep -q 'valid token without required authority -> 403' infrastructure/security/keycloak/kong-jwt-verification-contract-v1.0.md

      - name: Build MDM service
        shell: bash
        working-directory: domains/mdm
        run: mvn -B -DskipTests package

      - name: Start PostgreSQL for MDM
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name apms-mdm-security-postgres \
            -e POSTGRES_DB=apms_mdm \
            -e POSTGRES_USER=mdm \
            -e POSTGRES_PASSWORD=mdm \
            -p 15432:5432 \
            postgres:16-alpine

      - name: Wait for PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          timeout 90 bash -c 'until docker exec apms-mdm-security-postgres pg_isready -U mdm -d apms_mdm >/dev/null 2>&1; do sleep 2; done'

      - name: Generate disposable Keycloak client secret
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          openssl rand -hex 32 > /tmp/mdm-security-client-secret
          echo "KEYCLOAK_CLIENT_SECRET=$(cat /tmp/mdm-security-client-secret)" >> "$GITHUB_ENV"

      - name: Start Keycloak
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f infrastructure/security/docker-compose.security.yml up -d keycloak

      - name: Wait for Keycloak
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..60}; do
            if curl -fsS http://localhost:18080/realms/apms/.well-known/openid-configuration >/dev/null 2>&1; then
              exit 0
            fi
            docker compose -f infrastructure/security/docker-compose.security.yml logs --tail=80 keycloak >&2 || true
            sleep 2
          done
          echo 'Keycloak failed to become ready. Final logs:' >&2
          docker compose -f infrastructure/security/docker-compose.security.yml logs --tail=200 keycloak >&2 || true
          exit 1

      - name: Provision disposable Keycloak client secret
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f infrastructure/security/docker-compose.security.yml exec -T \
            -e KC_CLIENT_SECRET="$KEYCLOAK_CLIENT_SECRET" keycloak sh -lc '\
              /opt/keycloak/bin/kcadm.sh config credentials \
                --server http://localhost:8080 \
                --realm master \
                --user admin \
                --password admin >/dev/null && \
              CLIENT_ID=$(/opt/keycloak/bin/kcadm.sh get clients -r apms -q clientId=mdm-service-client --fields id --format csv | tr -d "\r\n\"") && \
              test -n "$CLIENT_ID" && \
              /opt/keycloak/bin/kcadm.sh update clients/$CLIENT_ID -r apms \
                -s publicClient=false \
                -s serviceAccountsEnabled=true \
                -s directAccessGrantsEnabled=false \
                -s standardFlowEnabled=false \
                -s clientId=mdm-service-client \
                -s secret="$KC_CLIENT_SECRET" >/dev/null'

      - name: Verify Keycloak token endpoint
        shell: bash
        run: |
          set -euo pipefail
          DISCOVERY="$(curl -fsS http://localhost:18080/realms/apms/.well-known/openid-configuration)"
          TOKEN_URL="$(printf '%s' "$DISCOVERY" | jq -r '.token_endpoint')"
          test -n "$TOKEN_URL"
          curl -sS -o /tmp/keycloak-token-check.json -w '%{http_code}' \
            -X POST "$TOKEN_URL" \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'client_id=mdm-service-client' \
            --data-urlencode "client_secret=$KEYCLOAK_CLIENT_SECRET" \
            --data-urlencode 'grant_type=client_credentials' > /tmp/keycloak-token-status.txt
          STATUS="$(cat /tmp/keycloak-token-status.txt)"
          if [[ "$STATUS" != "200" ]]; then
            cat /tmp/keycloak-token-check.json >&2 || true
            exit 1
          fi
          jq -e '.access_token' /tmp/keycloak-token-check.json >/dev/null

      - name: Prepare Kong trust material
        shell: bash
        run: |
          set -euo pipefail
          DISCOVERY="$(curl -fsS http://localhost:18080/realms/apms/.well-known/openid-configuration)"
          ISSUER="$(printf '%s' "$DISCOVERY" | jq -r '.issuer')"
          JWKS_URI="$(printf '%s' "$DISCOVERY" | jq -r '.jwks_uri')"
          JWKS="$(curl -fsS "$JWKS_URI")"
          jq -e '.keys | length > 0' >/dev/null <<<"$JWKS"
          KEY="$(jq -c '.keys | map(select(.kty=="RSA" and .n and .e and .kid)) | .[0]' <<<"$JWKS")"
          test "$KEY" != "null"
          KID="$(jq -r '.kid' <<<"$KEY")"
          N="$(jq -r '.n' <<<"$KEY")"
          E="$(jq -r '.e' <<<"$KEY")"
          python3 - "$ISSUER" "$KID" "$N" "$E" > /tmp/kong-rendered.yml <<'PY'
          import sys
          issuer, kid, n, e = sys.argv[1:]
          print('_format_version: "3.0"')
          print('_transform: true')
          print('consumers:')
          print('  - username: mdm-security-keycloak')
          print('    jwt_secrets:')
          print(f'      - key: {issuer}')
          print('        algorithm: RS256')
          print('        rsa_public_key: |')
          print('          -----BEGIN RSA PUBLIC KEY-----')
          print('          ' + n)
          print('          -----END RSA PUBLIC KEY-----')
          print('        key_claim_name: iss')
          print('services:')
          print('  - name: mdm')
          print('    url: http://host.docker.internal:8080')
          print('    routes:')
          print('      - name: mdm-api')
          print('        paths:')
          print('          - /mdm')
          print('        strip_path: false')
          print('    plugins:')
          print('      - name: jwt')
          print('        config:')
          print('          claims_to_verify:')
          print('            - exp')
          print('            - nbf')
          print('          key_claim_name: iss')
          print('          maximum_expiration: 3600')
          print('          run_on_preflight: true')
          PY
          printf '%s\n' "issuer=$ISSUER" "jwks=$JWKS_URI" "kid=$KID"

      - name: Start Kong
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/kong-rendered.yml infrastructure/security/kong/kong.yml
          docker compose -f infrastructure/security/docker-compose.security.yml up -d kong

      - name: Start MDM service
        shell: bash
        env:
          OTEL_SDK_DISABLED: 'true'
          OTEL_TRACES_EXPORTER: none
          OTEL_METRICS_EXPORTER: none
          OTEL_LOGS_EXPORTER: none
        run: |
          set -euo pipefail
          nohup java -jar domains/mdm/target/mdm-service-0.1.0-SNAPSHOT.jar \
            --spring.profiles.active=security \
            --server.port=8080 \
            --spring.datasource.url='jdbc:postgresql://localhost:15432/apms_mdm' \
            --spring.datasource.username=mdm \
            --spring.datasource.password=mdm \
            --spring.jpa.hibernate.ddl-auto=validate \
            --spring.security.oauth2.resourceserver.jwt.jwk-set-uri='http://localhost:18080/realms/apms/protocol/openid-connect/certs' \
            > /tmp/mdm-security.log 2>&1 &

      - name: Wait for Kong readiness
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 bash -c 'until curl -fsS http://localhost:18001/status >/dev/null; do sleep 2; done'

      - name: Wait for MDM readiness
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..60}; do
            if curl -fsS http://localhost:8080/actuator/health >/dev/null 2>&1; then exit 0; fi
            if [[ -s /tmp/mdm-security.log ]]; then tail -40 /tmp/mdm-security.log >&2 || true; fi
            sleep 2
          done
          cat /tmp/mdm-security.log >&2 || true
          exit 1

      - name: Run bounded authorization acceptance
        shell: bash
        run: |
          set -euo pipefail
          chmod +x infrastructure/security/keycloak/kong-jwt-acceptance.sh
          infrastructure/security/keycloak/kong-jwt-acceptance.sh

      - name: Publish runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mdm-security-acceptance-evidence
          path: |
            /tmp/mdm-security.log
            /tmp/postgres-security.log
            /tmp/mdm-security-result.json
            /tmp/keycloak-token-check.json
            infrastructure/security/README.md
            infrastructure/security/keycloak/kong-jwt-verification-contract-v1.0.md
            infrastructure/security/mdm-keycloak-kong-acceptance-plan-v1.0.md
            docs/ci/mdm-keycloak-kong-acceptance-runbook-v1.0.md

      - name: Publish PostgreSQL logs
        if: always()
        shell: bash
        run: docker logs apms-mdm-security-postgres > /tmp/postgres-security.log 2>&1 || true

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          rm -f /tmp/mdm-security-client-secret
          docker compose -f infrastructure/security/docker-compose.security.yml down -v || true
          docker rm -f apms-mdm-security-postgres >/dev/null 2>&1 || true
