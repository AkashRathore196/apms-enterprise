name: MDM Outbox Kafka

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - 'domains/mdm/**'
      - '.github/workflows/mdm-outbox-kafka.yml'

permissions:
  contents: read

jobs:
  outbox-kafka:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: domains/mdm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Validate Maven model
        run: mvn -B -DskipTests validate

      - name: Run Outbox/Kafka acceptance test only
        run: mvn -B -Dtest=OutboxKafkaIntegrationTest test
