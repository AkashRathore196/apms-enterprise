name: MDM Regression

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - 'domains/mdm/**'
      - '.github/workflows/mdm-regression.yml'

permissions:
  contents: read

jobs:
  unit-application:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: domains/mdm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Unit and application tests
        run: mvn -B -Dtest=MdmApplicationTest,PartyLifecycleAcceptanceTest,ProcessedEventIdempotencyTest test

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: domains/mdm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: PostgreSQL integration tests
        run: mvn -B -Dtest=PartyServiceIntegrationTest,MdmIntegrationTest test
