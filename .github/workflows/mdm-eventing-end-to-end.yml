name: MDM Eventing End-to-End Acceptance

on:
  push:
    branches:
      - feature/mdm-eventing-rebased
    paths:
      - 'domains/mdm/**'
      - '.github/workflows/mdm-eventing-end-to-end.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eventing-end-to-end:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: domains/mdm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Validate Maven model
        run: mvn -B -DskipTests validate

      - name: Run Outbox to Kafka to consumer acceptance test
        run: mvn -B -Dtest=OutboxToKafkaConsumerEndToEndIntegrationTest test
