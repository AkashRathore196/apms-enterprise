name: MDM Build

on:
  push:
    branches: [ main ]
    paths:
      - 'domains/mdm/**'
      - '.github/workflows/mdm-build.yml'
  pull_request:
    paths:
      - 'domains/mdm/**'
      - '.github/workflows/mdm-build.yml'

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: domains/mdm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Validate Maven model
        run: mvn -B -DskipTests validate

      - name: Build and test
        run: mvn -B test

      - name: Package
        run: mvn -B -DskipTests package

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mdm-service
          path: domains/mdm/target/*.jar
