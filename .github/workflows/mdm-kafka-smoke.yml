name: MDM Kafka Smoke

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/mdm-kafka-smoke.yml'
      - 'docs/branches/mdm-eventing-stages.md'

permissions:
  contents: read

jobs:
  kafka-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Start Apache Kafka container
        run: |
          docker run -d --name mdm-kafka-smoke \
            -p 9092:9092 \
            -e KAFKA_NODE_ID=1 \
            -e KAFKA_PROCESS_ROLES=broker,controller \
            -e KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093 \
            -e KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://127.0.0.1:9092 \
            -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
            -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT \
            -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093 \
            -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1 \
            -e KAFKA_AUTO_CREATE_TOPICS_ENABLE=true \
            -e CLUSTER_ID=MkU3OEVBNTcwNTJENDM2Qk \
            apache/kafka:3.8.0

      - name: Wait for Kafka port
        run: |
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/9092) >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker logs mdm-kafka-smoke
          exit 1

      - name: Produce one test record
        run: |
          docker exec mdm-kafka-smoke /opt/kafka/bin/kafka-console-producer.sh \
            --bootstrap-server localhost:9092 \
            --topic mdm-kafka-smoke <<'EOF'
smoke-event
EOF

      - name: Consume one test record
        run: |
          timeout 30s docker exec mdm-kafka-smoke /opt/kafka/bin/kafka-console-consumer.sh \
            --bootstrap-server localhost:9092 \
            --topic mdm-kafka-smoke \
            --from-beginning \
            --max-messages 1 | grep -Fx 'smoke-event'

      - name: Cleanup
        if: always()
        run: docker rm -f mdm-kafka-smoke
