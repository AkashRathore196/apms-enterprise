name: MDM Kafka Smoke

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - 'domains/mdm/**'
      - '.github/workflows/mdm-kafka-smoke.yml'

permissions:
  contents: read

jobs:
  kafka-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: domains/mdm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Kafka smoke test only
        run: mvn -B -Dtest=KafkaBrokerIntegrationTest test
