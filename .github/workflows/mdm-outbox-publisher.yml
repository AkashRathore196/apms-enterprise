name: MDM Outbox Publisher

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - 'domains/mdm/**'
      - '.github/workflows/mdm-outbox-publisher.yml'

permissions:
  contents: read

jobs:
  outbox-publisher:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: domains/mdm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Validate Maven model
        run: mvn -B -DskipTests validate

      - name: Run PostgreSQL-backed publisher integration test
        run: mvn -B -Dtest=OutboxPublisherPostgresIntegrationTest test
