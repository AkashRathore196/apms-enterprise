name: MDM Outbox Publisher Dispatch

on:
  push:
    branches:
      - feature/mdm-eventing-rebased
    paths:
      - 'domains/mdm/**'
      - '.github/workflows/mdm-outbox-publisher-dispatch.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  outbox-publisher:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: domains/mdm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Validate Maven model
        run: mvn -B -DskipTests validate
      - name: Run Outbox publisher behavior test
        run: mvn -B -Dtest=OutboxPublisherIntegrationTest test
