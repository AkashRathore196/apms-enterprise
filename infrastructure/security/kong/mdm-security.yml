_format_version: "3.0"
_transform: true

services:
  - name: mdm-service
    url: http://mdm-service:8080
    routes:
      - name: mdm-api
        paths:
          - /mdm
        strip_path: false
    plugins:
      - name: jwt
        config:
          key_claim_name: iss
          claims_to_verify:
            - exp
