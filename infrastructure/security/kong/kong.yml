_format_version: "3.0"
_transform: true

services:
  - name: mdm
    url: http://host.docker.internal:8080
    routes:
      - name: mdm-api
        paths:
          - /mdm
        strip_path: false
    plugins:
      - name: jwt
        config:
          claims_to_verify:
            - exp
            - nbf
          key_claim_name: iss
          maximum_expiration: 3600
          run_on_preflight: true
